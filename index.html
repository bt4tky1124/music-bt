#result li{

}

const songs = songNames.map(name => ({
    name,
    score:0,
    appearances:0
}));

const TOTAL_QUESTIONS = 100;

let questionCount = 0;
let currentChoices = [];

function shuffle(arr){
    return [...arr].sort(() => Math.random() - 0.5);
}

function getCurrentPool(){

    const ranking =
        [...songs].sort((a,b)=>b.score-a.score);

    if(questionCount < 80){
        return songs;
    }

    return ranking.slice(
        14,
        Math.min(45, ranking.length)
    );
}

function getFourSongs(){

    const pool = getCurrentPool();

    const minAppearances =
        Math.min(...pool.map(
            song => song.appearances
        ));

    let candidates =
        pool.filter(
            song =>
            song.appearances <=
            minAppearances + 1
        );

    if(candidates.length < 4){

        candidates =
            pool.filter(
                song =>
                song.appearances <=
                minAppearances + 2
            );
    }

    return shuffle(candidates).slice(0,4);
}

function renderQuestion(){

    if(questionCount >= TOTAL_QUESTIONS){
        showResults();
        return;
    }

    document.getElementById("progress").textContent =
        `${questionCount+1} / ${TOTAL_QUESTIONS}`;

    currentChoices = getFourSongs();

    const choices = document.getElementById("choices");
    choices.innerHTML = "";

currentChoices.forEach(song => {

    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = song.name;

    btn.onclick = () => {
        currentChoices.forEach(s => {
            s.appearances++;

            if (s === song) {
                s.score += 3;
            } else {
                s.score -= 1;
            }
        });

        questionCount++;
        renderQuestion();
    };

    choices.appendChild(btn);
});

} // ← renderQuestionここで閉じる

function showResults(){

    document.getElementById("choices").innerHTML = "";

    document.getElementById("progress").textContent =
        "終了";

    const ranking =
        [...songs].sort(
            (a,b) => b.score - a.score
        );

    let html = "<h2>結果</h2><ol>";

    ranking.slice(0,30).forEach(song => {

        html += `<li>${song.name}</li>`;

    });

    html += "</ol>";

    document.getElementById("result").innerHTML =
        html;
}

if (!theme) {

  .textContent = theme;

document.getElementById("mainScreen")
