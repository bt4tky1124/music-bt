#start100, #start300{
    padding:12px 18px;
    margin:6px;
    font-size:15px;
    background:#ffd6e7;
    color:#333;
    border:2px solid #f4a8c4;
    border-radius:12px;
    cursor:pointer;
}

#choices{
    display:grid;
    grid-template-columns: 1fr;
    gap:16px;
    margin-top:20px;
}

.description{
    font-size:13px;
    line-height:1.6;
    color:#666666;
}

/* 選択肢ボタン */
.choice{
    background:#ffd6e7;
    color:#222;

    border:2px solid #f4a8c4;
    border-radius:14px;

    padding:18px 12px;
    font-size:16px;

    cursor:pointer;
    text-align:center;

    transition:0.15s;

    position:relative;
    overflow:hidden;
}

.choice::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
    );

    transition:0.4s;
}

.choice:hover::before{
    left:100%;
}
body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#fff7fb;
    color:#333333;
}

    grid-template-columns: 1fr;

    margin-top:20px;

    border-left:3px dashed #f4a8c4;
    padding-left:12px;
}
    
#mainTitle{
    font-size:14px;

    margin-top:6px;

    letter-spacing:1px;
    color:#555;
}

#startScreen{
    text-align:center;
    margin-top:60px;
}

#titleInput{
    max-width:700px;
    padding:12px;
    font-size:16px;
    border:2px solid #f4a8c4;
    border-radius:12px;
    margin-bottom:16px;
}

    padding:12px 24px;
    font-size:16px;
    background:#ffd6e7;
    color:#333333;
    border:2px solid #f4a8c4;
    border-radius:12px;
    cursor:pointer;
}

#progress{
    text-align:center;
    font-size:18px;
    margin-bottom:20px;
    color:#666666;
}

#result{
    margin-top:20px;

    background:#fff;
    border:2px solid #f4a8c4;
    border-radius:18px;

    padding:16px;
}

#result ol{
    list-style:none;
    padding:0;
    margin:0;

    display:grid;
    grid-template-columns: 1fr 1fr; /* ←2列 */
    gap:6px;
}
#result li{
    padding:4px 0;      /* ←ここで行間調整 */
    margin:0;           /* ←余白削除 */

    font-size:14px;
    color:#333;

    line-height:1.2;    /* ←行間ぎゅっと詰める */

    background:none;    /* ←背景し */
}

</p>

const songs = songNames.map(name => ({
  name,
  score: 0,
  appearances: 0
}));

let TOTAL_QUESTIONS = 100;
let questionCount = 0;
let currentChoices = [];

function startGame(count) {
  const theme = document.getElementById("titleInput").value.trim();

  if (!theme) {
    alert("テーマを入力してください");
    return;
  }

  TOTAL_QUESTIONS = count;
  questionCount = 0;

  document.getElementById("mainTitle").textContent = theme;
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mainScreen").style.display = "block";

  renderQuestion();
}

function getFourSongs() {
  const pool = songs;

  const minApp = Math.min(...pool.map(s => s.appearances));

  const candidates = pool.filter(s =>
    s.appearances <= minApp + 1
  );

  const shuffled = [...candidates].sort(() => Math.random() - 0.5);

  const backup = [...songs].sort(() => Math.random() - 0.5);

  const result = [];

  for (let i = 0; i < backup.length && result.length < 4; i++) {
    const song = backup[i];
    if (!result.includes(song)) result.push(song);
  }

  while (result.length < 4) {
    result.push({ name: "ERROR", score: 0, appearances: 0 });
  }

  return result.slice(0, 4);
}

function renderQuestion() {
  if (questionCount >= TOTAL_QUESTIONS) {
    showResults();
    return;
  }

  document.getElementById("progress").textContent =
    `${questionCount + 1} / ${TOTAL_QUESTIONS}`;

  const choices = document.getElementById("choices");
  choices.innerHTML = "";

  currentChoices = getFourSongs();

  currentChoices.forEach(song => {
    if (!song || !song.name) return;

    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = song.name;

    btn.onclick = () => {
      currentChoices.forEach(s => {
        s.appearances++;
        if (s === song) s.score += 3;
        else s.score -= 1;
      });

      questionCount++;
      renderQuestion();
    };

    choices.appendChild(btn);
  });
}

function showResults() {
  document.getElementById("choices").innerHTML = "";

  const ranking = [...songs].sort((a, b) => b.score - a.score);

  let html = "<ol>";

  ranking.slice(0, 30).forEach((song) => {
  html += `<li>⋆ ${song.name}</li>`;
});

  html += "</ol>";

  document.getElementById("result").innerHTML = html;
}

/* ボタンイベント */

  .addEventListener("click", () => startGame(100));
